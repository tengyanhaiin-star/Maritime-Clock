<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Maritime Porthole Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea&family=Abril+Fatface&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0e0f14;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #wrap { position: relative; }
  canvas { display: block; position: absolute; top: 0; left: 0; }
  #static  { position: relative; } /* static layer: in-flow to size the wrapper */
  #dynamic { position: absolute; } /* dynamic layer: overlaid on top */
</style>
</head>
<body>
<div id="wrap">
  <canvas id="static"></canvas>
  <canvas id="dynamic"></canvas>
</div>
<script>
const ROMAN = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

const sCanvas = document.getElementById('static');
const dCanvas = document.getElementById('dynamic');
const sCtx = sCanvas.getContext('2d');
const dCtx = dCanvas.getContext('2d');

let W, H, CX, CY, S, dpr;
let staticDirty = true; // flag: redraw static layer on next frame

function sc(v){ return v * S; }

function resize(){
  const size = Math.min(document.documentElement.clientWidth, document.documentElement.clientHeight);
  W = size; H = size;
  dpr = window.devicePixelRatio || 1;

  [sCanvas, dCanvas].forEach(c => {
    c.width  = W * dpr;
    c.height = H * dpr;
    c.style.width  = W + 'px';
    c.style.height = H + 'px';
  });
  sCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  document.getElementById('wrap').style.width  = W + 'px';
  document.getElementById('wrap').style.height = H + 'px';

  CX = W / 2; CY = H / 2;
  S  = W / 520;
  staticDirty = true;
}

// ── helpers that accept a context argument ────────────────────────────────────
function ring(c, cx, cy, ro, ri, col){
  c.beginPath(); c.arc(cx,cy,ro,0,Math.PI*2); c.arc(cx,cy,ri,0,Math.PI*2,true);
  c.fillStyle = col; c.fill();
}
function circle(c, cx, cy, r, fill, stroke, sw){
  c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2);
  if(fill){  c.fillStyle   = fill;   c.fill();   }
  if(stroke){ c.strokeStyle = stroke; c.lineWidth = sw||1; c.stroke(); }
}
function rivet(c, rx, ry, r){
  c.save();
  c.shadowColor='rgba(0,0,0,0.5)'; c.shadowOffsetX=sc(2); c.shadowOffsetY=sc(3); c.shadowBlur=sc(4);
  circle(c, rx, ry, r, '#7a6018');
  c.restore();
  circle(c, rx, ry, r*0.78, '#c09640');
  circle(c, rx-r*0.28, ry-r*0.28, r*0.28, '#eed888');
}

// ── STATIC LAYER ─────────────────────────────────────────────────────────────
function drawStatic(){
  const c = sCtx;
  c.clearRect(0, 0, W, H);

  const R_WALL=sc(245), R_FLANGE_OUT=sc(245), R_FLANGE_IN=sc(218);
  const R_FRAME_OUT=sc(215), R_FRAME_IN=sc(200);
  const R_BEZEL_OUT=sc(202), R_BEZEL_IN=sc(196);
  const R_FACE=sc(196), R_RIVET=sc(231);

  // Outer wall plate
  circle(c, CX, CY, R_WALL, '#1a1c24');
  c.strokeStyle='rgba(50,54,66,0.5)'; c.lineWidth=1;
  for(let r=sc(200); r<R_WALL; r+=sc(10)){
    c.beginPath(); c.arc(CX,CY,r,0,Math.PI*2); c.stroke();
  }

  // Brass flange
  const gFlange = c.createRadialGradient(CX,CY,R_FLANGE_IN,CX,CY,R_FLANGE_OUT);
  gFlange.addColorStop(0,'#5a3b10'); gFlange.addColorStop(0.3,'#c09640');
  gFlange.addColorStop(0.55,'#e8c060'); gFlange.addColorStop(0.8,'#c09640'); gFlange.addColorStop(1,'#5a3b10');
  ring(c, CX,CY, R_FLANGE_OUT, R_FLANGE_IN, gFlange);
  ring(c, CX,CY, R_FLANGE_OUT, R_FLANGE_OUT-sc(4), '#f0d580');
  ring(c, CX,CY, R_FLANGE_IN+sc(4), R_FLANGE_IN, '#a07830');

  // 24 rivets on flange
  for(let i=0; i<24; i++){
    const a = 2*Math.PI*i/24 - Math.PI/2;
    rivet(c, CX+R_RIVET*Math.cos(a), CY+R_RIVET*Math.sin(a), sc(7));
  }

  // Cross bars
  const barH = sc(6);
  c.fillStyle = '#2e3242';
  c.fillRect(CX-R_FLANGE_OUT, CY-barH/2, R_FLANGE_OUT-R_FRAME_OUT, barH);
  c.fillRect(CX+R_FRAME_OUT,  CY-barH/2, R_FLANGE_OUT-R_FRAME_OUT, barH);
  c.fillRect(CX-barH/2, CY-R_FLANGE_OUT, barH, R_FLANGE_OUT-R_FRAME_OUT);
  c.fillRect(CX-barH/2, CY+R_FRAME_OUT,  barH, R_FLANGE_OUT-R_FRAME_OUT);

  // Cardinal bolt caps
  [0,90,180,270].forEach(d => {
    const rd = d*Math.PI/180;
    rivet(c, CX+R_FRAME_OUT*Math.cos(rd), CY+R_FRAME_OUT*Math.sin(rd), sc(10));
  });

  // Iron porthole frame
  const gIron = c.createRadialGradient(CX,CY,R_FRAME_IN,CX,CY,R_FRAME_OUT);
  gIron.addColorStop(0,'#303446'); gIron.addColorStop(1,'#252835');
  ring(c, CX,CY, R_FRAME_OUT, R_FRAME_IN, gIron);

  // Brass inner bezel
  const gBez = c.createRadialGradient(CX,CY,R_BEZEL_IN,CX,CY,R_BEZEL_OUT);
  gBez.addColorStop(0,'#5a3b10'); gBez.addColorStop(0.5,'#b08030'); gBez.addColorStop(1,'#f0d070');
  ring(c, CX,CY, R_BEZEL_OUT, R_BEZEL_IN, gBez);

  // Clock face
  const gFace = c.createRadialGradient(CX-sc(20),CY-sc(20),sc(10),CX,CY,R_FACE);
  gFace.addColorStop(0,'#f0e8d2'); gFace.addColorStop(1,'#d4c8a8');
  circle(c, CX, CY, R_FACE, gFace);

  // Two decorative concentric rings
  c.strokeStyle='rgba(140,128,100,0.5)'; c.lineWidth=sc(1.2);
  [190,182].forEach(r => { c.beginPath(); c.arc(CX,CY,sc(r),0,Math.PI*2); c.stroke(); });

  // Tick marks
  for(let i=0; i<60; i++){
    const a = 2*Math.PI*i/60 - Math.PI/2;
    const major = i%5===0;
    const r_out = sc(190), r_in = sc(182);
    c.beginPath();
    c.moveTo(CX+r_out*Math.cos(a), CY+r_out*Math.sin(a));
    c.lineTo(CX+r_in*Math.cos(a),  CY+r_in*Math.sin(a));
    c.strokeStyle = major ? 'rgba(50,44,30,0.9)' : 'rgba(120,112,90,0.7)';
    c.lineWidth   = major ? sc(3) : sc(1.5);
    c.stroke();
  }

  // Corner mounting bolts
  [45,135,225,315].forEach(d => {
    const rd = d*Math.PI/180;
    rivet(c, CX+sc(236)*Math.cos(rd), CY+sc(236)*Math.sin(rd), sc(8));
  });
}

// ── DYNAMIC LAYER (per-frame) ─────────────────────────────────────────────────
function drawHand(c, angle, length, baseW, col){
  const rad=angle-Math.PI/2, perp=rad+Math.PI/2;
  const tx=CX+length*Math.cos(rad), ty=CY+length*Math.sin(rad);
  const tail=length*0.17;
  const bx1=CX+baseW*Math.cos(perp), by1=CY+baseW*Math.sin(perp);
  const bx2=CX-baseW*Math.cos(perp), by2=CY-baseW*Math.sin(perp);
  const tailx=CX-tail*Math.cos(rad), taily=CY-tail*Math.sin(rad);
  const tw=baseW*0.18;
  const lx2=tx+tw*Math.cos(perp), ly2=ty+tw*Math.sin(perp);
  const rx2=tx-tw*Math.cos(perp), ry2=ty-tw*Math.sin(perp);
  c.save();
  c.shadowColor='rgba(0,0,0,0.45)'; c.shadowOffsetX=sc(4); c.shadowOffsetY=sc(5); c.shadowBlur=sc(6);
  c.beginPath(); c.moveTo(bx1,by1); c.lineTo(lx2,ly2); c.lineTo(tx,ty); c.lineTo(rx2,ry2); c.lineTo(bx2,by2); c.lineTo(tailx,taily); c.closePath(); c.fillStyle=col; c.fill();
  c.restore();
  c.beginPath(); c.moveTo(bx1,by1); c.lineTo(lx2,ly2); c.lineTo(tx,ty); c.lineTo(rx2,ry2); c.lineTo(bx2,by2); c.lineTo(tailx,taily); c.closePath(); c.fillStyle=col; c.fill();
  const mx=CX+(tx-CX)*0.995, my=CY+(ty-CY)*0.995;
  c.beginPath(); c.moveTo(CX,CY); c.lineTo(mx,my);
  c.strokeStyle='rgba(210,178,90,0.6)'; c.lineWidth=Math.max(sc(0.5),baseW/6); c.stroke();
}

function drawDynamic(){
  const c = dCtx;
  c.clearRect(0, 0, W, H);

  const now = new Date();
  const sec = now.getSeconds() + now.getMilliseconds()/1000;
  const min = now.getMinutes() + sec/60;
  const hr  = (now.getHours()%12) + min/60;

  // ── Roman numerals (Abril Fatface, Google Font) ──
  const R_NUMERAL = isMobile ? sc(146) : sc(138);
  c.font = `${sc(92)}px 'Abril Fatface', serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for(let h=0; h<12; h++){
    const a = 2*Math.PI*h/12 - Math.PI/2;
    const nx = CX + R_NUMERAL*Math.cos(a);
    const ny = CY + R_NUMERAL*Math.sin(a);
    const rot = a + Math.PI/2;
    c.save();
    c.translate(nx, ny);
    c.rotate(rot);
    c.scale(0.5, 1);
    c.shadowColor = 'transparent';
    c.fillStyle = '#2e2818';
    c.fillText(ROMAN[h], 0, 0);
    c.restore();
  }

  // ── Brand text (Caladea, Google Font) ──
  c.font = `${sc(16)}px 'Caladea', serif`;
  c.letterSpacing = '0px';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = 'rgba(80,72,52,0.7)'; c.fillText('MARINE · CHRONOMETER', CX, CY+sc(45));
  c.fillStyle = 'rgba(80,72,52,0.5)'; c.fillText('No.7 · NAVIGATION',    CX, CY+sc(65));

  // ── Compass star ──
  const starOuter=sc(32), starWaist=sc(8);
  c.fillStyle = 'rgba(140,130,108,0.75)';
  c.beginPath();
  for(let p=0; p<4; p++){
    const tipAngle   = p*Math.PI/2 - Math.PI/2;
    const sideAngle1 = tipAngle - Math.PI/2;
    const sideAngle2 = tipAngle + Math.PI/2;
    const tx2=CX+starOuter*Math.cos(tipAngle), ty2=CY+starOuter*Math.sin(tipAngle);
    const wx1=CX+starWaist*Math.cos(sideAngle1), wy1=CY+starWaist*Math.sin(sideAngle1);
    const wx2=CX+starWaist*Math.cos(sideAngle2), wy2=CY+starWaist*Math.sin(sideAngle2);
    if(p===0) c.moveTo(wx1,wy1); else c.lineTo(wx1,wy1);
    c.lineTo(tx2,ty2); c.lineTo(wx2,wy2);
  }
  c.closePath(); c.fill();

  // ── Centre brass cap (under hands) ──
  circle(c, CX, CY, sc(9), '#c09640');
  circle(c, CX, CY, sc(6), '#e8c860');
  circle(c, CX, CY, sc(3), '#f8e890');

  // ── Hands ──
  drawHand(c, hr*2*Math.PI/12,  sc(104), sc(7), '#2c2416');
  drawHand(c, min*2*Math.PI/60, sc(150), sc(5), '#2c2416');

  // ── Second hand ──
  const sRad = sec*2*Math.PI/60 - Math.PI/2;
  c.save();
  c.shadowColor='rgba(0,0,0,0.4)'; c.shadowOffsetX=sc(2); c.shadowOffsetY=sc(3); c.shadowBlur=sc(4);
  c.beginPath();
  c.moveTo(CX-sc(26)*Math.cos(sRad), CY-sc(26)*Math.sin(sRad));
  c.lineTo(CX+sc(168)*Math.cos(sRad), CY+sc(168)*Math.sin(sRad));
  c.strokeStyle='#9e3414'; c.lineWidth=sc(2); c.stroke();
  c.restore();

  // ── Centre cap (over hands) ──
  circle(c, CX, CY, sc(9), '#c09640');
  circle(c, CX, CY, sc(6), '#e8c860');
  circle(c, CX, CY, sc(3), '#f8e890');
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(){
  if(staticDirty){
    drawStatic();
    staticDirty = false;
  }
  drawDynamic();
  requestAnimationFrame(loop);
}

document.addEventListener('touchmove',  e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => { setTimeout(resize, 100); });

// Wait for Google Fonts before first paint so numerals render in the right font
document.fonts.ready.then(() => {
  resize();
  loop();
});
</script>
</body>
</html>
